name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  db-migrations:
    name: Validate migrations on a fresh database
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas_starter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saas_starter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply Supabase auth stubs
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/supabase-auth-stubs.sql
          echo "::notice::Auth stubs applied"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/saas_starter_test

      - name: Apply migrations in order
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "::notice::Migrations applied successfully"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/saas_starter_test

      - name: Run multi-tenant RLS isolation tests
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/isolation-tests.sql
          echo "::notice::Multi-tenancy RLS isolation tests passed (A→A/A→B/B→B/B→A + invitations)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/saas_starter_test

      - name: Run Registra tests (seeds, RLS, isolation Org A/B, RPC security)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/registra-tests.sql
          echo "::notice::Registra tests passed (owner/member/cross-org + read RPC permission guards)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/saas_starter_test

      - name: Run billing engine tests (plans, entitlements, limits, usage, security)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/billing-tests.sql
          echo "::notice::Billing engine tests passed (entitlements, limits, usage, RLS, security)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/saas_starter_test

      - name: Run email outbox tests (file, idempotence, retry, security)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/email-outbox-tests.sql
          echo "::notice::Email outbox tests passed (queue, idempotence, retry, RLS, service_role)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/saas_starter_test

      - name: Run notifications tests (catalogue, ownership, preferences, security)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/notifications-tests.sql
          echo "::notice::Notifications tests passed (templates, ownership, RLS, service_role)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/saas_starter_test

      - name: Run storage tests (buckets, paths, isolation, security)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/storage-tests.sql
          echo "::notice::Storage tests passed (buckets, path integrity, RLS isolation, service_role only)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/saas_starter_test

      - name: Run jobs foundation tests (queue, idempotence, retry, delayed, failed, logs, cron, security)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/jobs-foundation-tests.sql
          echo "::notice::Jobs foundation tests passed (queue, idempotence, retry, delayed, max attempts, cancel, logs, cron, RLS, service_role)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/saas_starter_test

      - name: Verify schema objects
        run: |
          echo "Tables in public schema:"
          psql "$DATABASE_URL" -At -c \
            "SELECT tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename;"
          echo "RLS policies per table:"
          psql "$DATABASE_URL" -At -c \
            "SELECT tablename, count(*) FROM pg_policies WHERE schemaname = 'public' GROUP BY tablename ORDER BY tablename;"
          echo "RLS enabled on foundations tables:"
          psql "$DATABASE_URL" -At -c \
            "SELECT tablename FROM pg_tables WHERE schemaname = 'public' AND tablename IN ('profiles','organizations','memberships','roles','permissions','role_permissions','invitations') ORDER BY tablename;"
          echo "RLS enabled on billing tables:"
          psql "$DATABASE_URL" -At -c \
            "SELECT tablename FROM pg_tables WHERE schemaname = 'public' AND tablename IN ('plans','features','plan_features','plan_limits','subscriptions','usage','usage_events') ORDER BY tablename;"
          echo "RLS enabled on Registra tables:"
          psql "$DATABASE_URL" -At -c \
            "SELECT tablename FROM pg_tables WHERE schemaname = 'public' AND tablename IN ('organization_registra_settings','groups','persons','attendance_records') ORDER BY tablename;"
          echo "RLS enabled on notifications/storage tables:"
          psql "$DATABASE_URL" -At -c \
            "SELECT tablename FROM pg_tables WHERE schemaname = 'public' AND tablename IN ('email_outbox','notification_templates','notification_preferences','notifications','storage_files') ORDER BY tablename;"
          echo "RLS enabled on jobs/cron tables:"
          psql "$DATABASE_URL" -At -c \
            "SELECT tablename FROM pg_tables WHERE schemaname = 'public' AND tablename IN ('jobs','job_logs','cron_tasks','cron_executions') ORDER BY tablename;"
          echo "Storage buckets:"
          psql "$DATABASE_URL" -At -c \
            "SELECT id || ':' || public FROM storage.buckets ORDER BY id;"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/saas_starter_test