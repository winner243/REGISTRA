# Configuration Supabase locale du SaaS Starter V2.
# Générée pour un environnement de développement reproductible
# (équivalent de `supabase init`). Ne pas utiliser en production :
# chaque environnement (dev/preview/prod) est un projet Supabase distinct.

# Identifiant du projet local (lettres minuscules, chiffres, tirets).
project_id = "saas-starter-v2"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
# L'application Next.js tourne sur http://localhost:3000 en développement.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true